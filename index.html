<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIPES — 3D Replica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121518'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8a13a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=1221">
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="vitals">
    <div class="bar-row"><span class="bar-label">LAMP</span><div class="bar"><div id="battery" class="fill battery"></div></div></div>
    <div class="bar-row"><span class="bar-label">WARM</span><div class="bar"><div id="warmth" class="fill warmth"></div></div></div>
  </div>
  <div id="caps">0 caps</div>
  <div id="pockets"></div>
  <div id="effects"></div>
  <div id="objective"></div>
  <div id="boss-keys" class="hidden"></div>
  <div id="prompt"></div>
  <div id="night-card"></div>
  <div id="touch">
    <div class="pad">
      <button class="tbtn t-up" data-act="forward" aria-label="Crawl ahead">▲</button>
      <button class="tbtn t-left" data-act="left" aria-label="Turn left">◀</button>
      <button class="tbtn t-back" data-act="back" aria-label="Back up">▼</button>
      <button class="tbtn t-right" data-act="right" aria-label="Turn right">▶</button>
    </div>
    <div class="acts">
      <button class="tbtn act" data-act="interact" aria-label="Interact">E</button>
      <button class="tbtn act" data-act="lamp" aria-label="Lamp">F</button>
      <button class="tbtn act" data-act="map" aria-label="Map">M</button>
    </div>
  </div>
</div>

<!-- Map overlay -->
<div id="map" class="hidden"></div>

<!-- Job / shop modal -->
<div id="modal" class="hidden">
  <div id="modal-box"></div>
</div>

<!-- Death / campfire -->
<div id="death" class="hidden">
  <div id="death-box">
    <h1 id="death-title">CAUGHT</h1>
    <p id="death-text"></p>
    <button id="revive-btn">Revive — back to the safe room</button>
    <button id="retry-btn">Back to the campfire</button>
  </div>
</div>

<!-- Title / lobby -->
<div id="lobby" class="overlay">
  <div class="lobby-box">
    <h1>PIPES</h1>
    <p class="sub">Night maintenance. Good pay. No experience.</p>
    <div class="diff-row">
      <label>Chapter</label>
      <select id="chapter">
        <option value="1" selected>Chapter 1 — The Pipes</option>
        <option value="2">Chapter 2 — The Vents</option>
        <option value="3">Chapter 3 — The Growth</option>
      </select>
    </div>
    <div class="diff-row">
      <label>Difficulty</label>
      <select id="difficulty">
        <option value="easy">EASY</option>
        <option value="normal" selected>NORMAL</option>
        <option value="hard">HARD</option>
        <option value="insane">INSANE</option>
      </select>
    </div>
    <button id="start-btn">Clock In — Night 1</button>
    <p class="hint">W/Up crawl ahead · A/D turn · S back up · F lamp · M map · E interact · 1-4 use item</p>
  </div>
</div>

<script type="module" src="main.js?v=1221"></script>
</body>
</html>
